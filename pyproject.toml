[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bids_prov"
authors = [
    { name = "Camille Maumet" },
    { name = "Satrajit Ghosh" },
    { name = "Stefan Appelhoff" },
    { name = "Chris Markiewicz" },
    { name = "Yaroslav Halchenko" },
    { name = "Jean-Baptiste Poline" },
    { name = "Rémi Adon" },
    { name = "Hermann Courteille" },
    { name = "Thomas Betton" },
    { name = "Cyril Regan" },
    { name = "Boris Clénet"}
]
description = "BIDS extension proposal 28 : BIDS Provenance"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
include = ["bids_prov/visualize.py"]
exclude = ["bids_prov*"]

[tool.poetry.dependencies]
python = "^3.10.0"
beautifulsoup4 = "^4.12.3"
boutiques = "^0.5.26"
click = "^8.1.7"
deepdiff = "^7.0.1"
graphviz = "^0.20.3"
rdflib = "^7.0.0"
rdflib-jsonld = "^0.6.2"
prov = "^2.0.0"
pydot = "^2.0.0"
pyld = "^2.0.4"
pyyaml = "^6.0.1"
requests = "^2.32.3"
pybids = "^0.20.0"
rfc3986 = "^2.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
markdownify = "^0.12.1"
pre-commit = "^3.7.1"
pytest = "^8.4.2"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
bids_prov_visualizer = "bids_prov.visualize:entry_point"
